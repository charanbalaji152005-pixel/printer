<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favPrinter" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#374151" />
      <stop offset="100%" stopColor="#111827" />
    </linearGradient>
    <linearGradient id="favPaper" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#f3f4f6" />
    </linearGradient>
  </defs>
  <!-- Printer chassis -->
  <rect x="6" y="8" width="52" height="24" rx="5" fill="url(#favPrinter)" stroke="#4b5563" stroke-width="2" />
  <!-- Slot mouth -->
  <rect x="12" y="24" width="40" height="4" rx="2" fill="#030712" />
  <!-- LED indicator -->
  <circle cx="48" cy="16" r="2.5" fill="#10b981" />
  <circle cx="16" cy="16" r="2" fill="#9ca3af" />
  <!-- Paper receipt sliding out -->
  <path d="M 16 26 L 48 26 L 48 54 L 44 51 L 40 54 L 36 51 L 32 54 L 28 51 L 24 54 L 20 51 L 16 54 Z" fill="url(#favPaper)" stroke="#d1d5db" stroke-width="1.5" />
  <!-- Receipt text lines -->
  <line x1="22" y1="33" x2="42" y2="33" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="39" x2="38" y2="39" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="45" x2="34" y2="45" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
</svg>